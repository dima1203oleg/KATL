version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database (PIM, RFQs, Audit Logs, Sync Tables)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: katl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katl_production}
      POSTGRES_USER: ${POSTGRES_USER:-katl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katl_secure_password_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katl_user} -d ${POSTGRES_DB:-katl_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Job Queue Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: katl-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Backend REST API Service (@katl/api)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: katl-api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-change_in_production_secret_key_32bytes}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Background Worker Service (@katl/worker)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: katl-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 5. Web Frontend (@katl/web)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: katl-web
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
