services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database (PIM, RFQs, Audit Logs, Sync Tables)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katl_production}
      POSTGRES_USER: ${POSTGRES_USER:-katl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katl_secure_password_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katl_user} -d ${POSTGRES_DB:-katl_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Job Queue Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Apply PostgreSQL schema before the API accepts traffic
  # ---------------------------------------------------------------------------
  migrate:
    image: katl-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets:
        - proxy_ca
    command: ["npm", "--workspace=@katl/api", "run", "migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Backend REST API Service (@katl/api)
  # ---------------------------------------------------------------------------
  api:
    image: katl-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets:
        - proxy_ca
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-change_in_production_secret_key_32bytes}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 4. Background Worker Service (@katl/worker)
  # ---------------------------------------------------------------------------
  worker:
    image: katl-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      secrets:
        - proxy_ca
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 5. Web Frontend (@katl/web)
  # ---------------------------------------------------------------------------
  web:
    image: katl-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - proxy_ca
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://katl_user:katl_secure_password_dev@postgres:5432/katl_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_URL: ${API_URL:-http://api:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/dev/null}
