services:
  postgres:
    environment:
      POSTGRES_DB: katl_dev
      POSTGRES_USER: katl_dev_user
      POSTGRES_PASSWORD: katl_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katl_dev_user -d katl_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://katl_dev_user:katl_dev_password@postgres:5432/katl_dev
      REDIS_URL: redis://redis:6379
  migrate:
    environment:
      DATABASE_URL: postgresql://katl_dev_user:katl_dev_password@postgres:5432/katl_dev

  worker:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://katl_dev_user:katl_dev_password@postgres:5432/katl_dev
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_EMAIL: admin@katl.local
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    environment:
      NODE_ENV: development
      PORT: 3000
